<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quizora — a library of fast, beautiful quiz games." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Quizora — Quiz Games Library</title>
    <meta name="theme-color" content="#07060b" />
    <style>
      html, body { background: #07060b; margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 40%, rgba(139, 92, 246, 0.18), transparent 70%), #07060b; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 18px; color: #fff; font: 700 22px/1 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.02em; }
      .boot-mark { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); box-shadow: 0 10px 40px -8px rgba(139, 92, 246, 0.8); animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(0.92); opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Quizora"><div class="boot-in"><span class="boot-mark">Q</span>Quizora</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
